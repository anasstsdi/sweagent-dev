# In-memory H2 so the app + tests run without an external database.
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
server.port=8090

# Browse the in-memory DB at http://localhost:8090/h2-console
# JDBC URL: jdbc:h2:mem:demo   -   user: sa   -   password: (empty)
spring.h2.console.enabled=true
